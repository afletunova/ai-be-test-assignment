services: 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/backend
    working_dir: /backend
    command: fastapi run main.py --port 8080

  db:
    image: pgvector/pgvector:pg18
    container_name: pgvector-db
    env_file:
      - .env
    ports:
      - "5434:5432"
    volumes:
      - data_sql:/var/lib/postgresql
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/01-init-db.sh:ro
      - ./postgres/schema.sql:/tmp/schema.sql:ro

volumes:
  data_sql: